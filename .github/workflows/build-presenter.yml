name: Build PC Controller Presenter Firmware

on:
  push:
    branches:
      - main
      - "feature/pc-controller"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-presenter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install verified actionlint
        run: |
          actionlint_bin="$(./tools/install-actionlint.sh "$RUNNER_TEMP/actionlint")"
          echo "ACTIONLINT_BIN=${actionlint_bin}" >> "$GITHUB_ENV"

      - name: Validate repository metadata
        run: python3 tools/check_repo.py

      - name: Lint GitHub Actions workflows
        run: ${ACTIONLINT_BIN} -color .github/workflows/*.yml

  host-tests:
    name: Host tests
    runs-on: ubuntu-latest
    needs: repo-checks
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install verified actionlint
        run: |
          actionlint_bin="$(./tools/install-actionlint.sh "$RUNNER_TEMP/actionlint")"
          echo "ACTIONLINT_BIN=${actionlint_bin}" >> "$GITHUB_ENV"

      - name: Install host build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Run static gate (host tests + actionlint)
        run: ./tools/validate.sh --static

      - name: Upload host test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: presenter-host-test-logs-${{ github.run_id }}
          path: |
            /tmp/ai-passport-host-tests.*/
          if-no-files-found: ignore
          retention-days: 3

  firmware-build:
    name: ESP-IDF 5.5.3 PC Controller presenter firmware
    runs-on: ubuntu-latest
    needs: host-tests
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Restore ccache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .ccache
          key: build-presenter-ccache-${{ github.ref_type }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            build-presenter-ccache-${{ github.ref_type }}-${{ github.ref_name }}-
            build-presenter-ccache-

      # SDKCONFIG_DEFAULTS 必须同时包含 sdkconfig.defaults(基础配置:
      # Flash 大小、分区表、bootloader、console、字体、FreeRTOS 等)和
      # sdkconfig.presenter.defaults(presenter 档增量:Wi-Fi 关闭、
      # NimBLE 安全设置、电源管理、字体再声明)。
      #
      # Run #9-#11 调试记录:
      #  #9   仅在 Configure 用 -D "SDKCONFIG_DEFAULTS=...;..." 设进
      #       CMake cache。Build / Merge 也成功,但生成的 sdkconfig
      #       不带 CONFIG_PC_CONTROLLER_APP=y → verify 失败。
      #  #10  同 #9,verify_presenter_build.py 明确报 sdkconfig 缺
      #       CONFIG_PC_CONTROLLER_APP,说明 sdkconfig.presenter.defaults
      #       没有被加载。
      #  #11  改用 extra_docker_args "-e SDKCONFIG_DEFAULTS=...;..."
      #       注入到容器 env,Configure 步骤在 1s 内失败(exit 1),
      #       推测 docker -e 参数在多 -e 同时存在或 ; 在 value 中
      #       被 action 处理异常。
      #
      # 修复:用 inline env prefix `SDKCONFIG_DEFAULTS="..."` 直接写在
      # command 字符串里。bash -c '...' 不会重新展开外层单引号里的
      # 双引号,SDKCONFIG_DEFAULTS 值(含 ;)会被原样保留并 export
      # 到 idf.py 进程中。Configure 同步保留 -D 作 cmake cache 兜底,
      # Build / Merge 只靠 env prefix。三步同一份分层 defaults,cmake
      # 重新跑也不会丢 presenter 档增量。

      - name: Configure PC Controller presenter profile (ESP-IDF 5.5.3 / esp32c3)
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v5.5.3
          target: esp32c3
          extra_docker_args: >-
            -e CCACHE_DIR=/app/${{ github.repository }}/.ccache
            -e IDF_CCACHE_ENABLE=1
          command: SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.presenter.defaults" idf.py -B /tmp/presenter-build -D "SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.presenter.defaults" set-target esp32c3

      - name: Build PC Controller presenter firmware
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v5.5.3
          target: esp32c3
          extra_docker_args: >-
            -e CCACHE_DIR=/app/${{ github.repository }}/.ccache
            -e IDF_CCACHE_ENABLE=1
          command: SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.presenter.defaults" idf.py -B /tmp/presenter-build build

      - name: Merge PC Controller presenter firmware binary
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v5.5.3
          target: esp32c3
          extra_docker_args: >-
            -e CCACHE_DIR=/app/${{ github.repository }}/.ccache
            -e IDF_CCACHE_ENABLE=1
          command: SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.presenter.defaults" idf.py -B /tmp/presenter-build merge-bin -o /tmp/presenter-build/FoloToy-AI-Passport-full.bin

      - name: Verify merged firmware layout
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v5.5.3
          target: esp32c3
          # 用 Python 脚本一次性完成 profile 检查 + firmware layout 校验:
          # 替换之前的 `grep && grep && python3` 单行命令。grep 链依赖 bash
          # 引号处理,SDKCONFIG_DEFAULTS 分号被吃掉时整步返回 2 但没有 stderr
          # 行,annotation 只显示 "Process completed with exit code 2",无法
          # 定位是 grep 还是 verify_firmware.py 失败;新脚本会用 stderr
          # 明确写出缺失的 sdkconfig 行或合并固件 layout 不一致原因。
          command: python3 tools/verify_presenter_build.py /tmp/presenter-build

      - name: Upload PC Controller presenter firmware artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: presenter-firmware-${{ github.run_id }}
          path: /tmp/presenter-build/FoloToy-AI-Passport-full.bin
          if-no-files-found: error
          retention-days: 7
